name: ecomlakehouse

x-airflow-image: &airflow-image
  image: ecomlakehouse-airflow:latest
  build:
    context: .
    dockerfile: airflow/Dockerfile

x-airflow-common: &airflow-common
  <<: *airflow-image
  restart: unless-stopped
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API_AUTH__JWT_SECRET: "change-this-to-a-long-random-secret-8f7c3d91b5e24a6f"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://ecom-airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@ecom-airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    PYTHONPATH: /opt/ecomlakehouse/src
    _PIP_ADDITIONAL_REQUIREMENTS: ""

    # Ecommerce PostgreSQL source DB
    POSTGRES_HOST: ecom-postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ecom_user
    POSTGRES_PASSWORD: ecom_password
    POSTGRES_DB: ecommerce

    # MinIO Lakehouse Storage
    S3_ENDPOINT: http://ecom-minio:9000
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin123
    S3_BUCKET: ecommerce-lake
    S3_REGION: us-east-1

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/ecomlakehouse/src

  networks:
    - ecom-lakehouse-network

services:

  # ---------------------------------------------------------------------------
  # DATA STORAGE LAYER
  # ---------------------------------------------------------------------------

  # Source PostgreSQL (OLTP)
  postgres:
    image: postgres:16
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_password
      POSTGRES_DB: ecommerce
    ports:
      - "5441:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_user -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecom-lakehouse-network

  # MinIO Object Storage (Data Lakehouse)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ecom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ecom-lakehouse-network

  # ---------------------------------------------------------------------------
  # ORCHESTRATION LAYER (AIRFLOW 3)
  # ---------------------------------------------------------------------------

  # Airflow Internal Metadata Database
  airflow-postgres:
    image: postgres:16
    container_name: ecom-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecom-lakehouse-network

  # Airflow Database Migration, User, and Connection Provisioner
  airflow-init:
    <<: *airflow-common
    container_name: ecom-airflow-init
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e

        echo "=========================================="
        echo "Running Airflow database migration"
        echo "=========================================="
        airflow db migrate

        echo "=========================================="
        echo "Creating Airflow admin user"
        echo "=========================================="
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

        echo "=========================================="
        echo "Configuring Airflow connection and variables"
        echo "=========================================="
        airflow connections delete ecom_postgres 2>/dev/null || true
        airflow connections add ecom_postgres \
          --conn-type postgres \
          --conn-host ecom-postgres \
          --conn-schema ecommerce \
          --conn-login ecom_user \
          --conn-password ecom_password \
          --conn-port 5432 || true

        airflow variables set BUCKET ecommerce-lake || true

        echo "=========================================="
        echo "Airflow initialization complete"
        echo "=========================================="

  # Airflow Web & API Server
  airflow-apiserver:
    <<: *airflow-common
    container_name: ecom-airflow-apiserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: api-server

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: ecom-airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # Airflow DAG Processor
  airflow-dag-processor:
    <<: *airflow-common
    container_name: ecom-airflow-dag-processor
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  # Airflow CLI Utility Container
  airflow-cli:
    <<: *airflow-common
    container_name: ecom-airflow-cli
    restart: "no"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow"

# -----------------------------------------------------------------------------
# PERSISTENT STORAGE VOLUMES
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  minio-data:
  airflow-postgres-data:

# -----------------------------------------------------------------------------
# DOCKER NETWORKING (Automatically created and managed)
# -----------------------------------------------------------------------------
networks:
  ecom-lakehouse-network:
    name: ecom-lakehouse-network